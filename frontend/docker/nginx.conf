# Dropped into /etc/nginx/conf.d/default.conf by the Dockerfile — this file
# is INCLUDED inside the base image's existing `http {}` block, so it must
# only contain http-context directives (server{}, limit_req_zone, etc.),
# not worker_processes/events/http{} themselves.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;  # individual upload chunks, not whole files

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA routing: any unmatched path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the CloudVault backend service (see docker-compose.yml).
    # No trailing slash on proxy_pass here - that means the full request URI
    # (e.g. /api/v1/auth/login) is forwarded unchanged, matching the
    # backend's own /api/v1 route prefix exactly. (A trailing slash would
    # strip the /api/ location prefix and misroute to /v1/... instead.)
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Cache hashed static assets aggressively; index.html itself stays revalidated
    location ~* \.(js|css|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ---------------------------------------------------------------------
